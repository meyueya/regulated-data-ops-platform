[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulated-data-ops-platform"
version = "4.0.0"
description = "Policy-governed operations plane for synthetic regulated payment events"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pedro Castillo" }]
keywords = ["data-engineering", "data-contracts", "data-quality", "lineage", "security"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
test = ["httpx2==2.9.1"]

[project.scripts]
regulated-data-ops = "regulated_data_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regulated_data_ops = ["static/*.html", "static/*.css", "static/*.js"]
