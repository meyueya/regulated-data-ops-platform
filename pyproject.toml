[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulated-data-ops-platform"
version = "2.0.0"
description = "Policy-driven trust controls for synthetic regulated payment events"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pedro Castillo" }]
keywords = ["data-engineering", "data-contracts", "data-quality", "lineage", "security"]

[project.scripts]
regulated-data-ops = "regulated_data_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
